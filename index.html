<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sarjakuvalukija</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --accent:#ffcc00; --muted:#9a9a9a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f5; --fg:#111; --accent:#b38f00; --muted:#555; }
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; }
  #stage { position:relative; flex:1; background:#000; overflow:hidden; touch-action:none; }
  #video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #overlay { pointer-events:none; }
  #controls { padding:12px 16px calc(12px + env(safe-area-inset-bottom));
              display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font-size:1.05rem; padding:12px 18px; border-radius:12px; border:0;
           background:var(--accent); color:#000; font-weight:600; }
  button:disabled { opacity:.4; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--muted); }
  label { font-size:.9rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #status { flex:1 1 100%; font-size:.95rem; color:var(--muted); }
  #last { flex:1 1 100%; font-size:1.15rem; line-height:1.4; min-height:2.8em; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="controls">
  <button id="startBtn">Käynnistä kamera</button>
  <button id="stopBtn" class="secondary" disabled>Pysäytä</button>
  <label><input id="bubbleOnly" type="checkbox"> Vain puhekuplat</label>
  <label>Puhenopeus
    <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1">
  </label>
  <div id="status">Valmiina.</div>
  <div id="last" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
